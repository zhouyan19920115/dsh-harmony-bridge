# Insert the DSH Harmony phone bridge into the profile.
#
# After installing the plugin, DSH starts the bridge together with itself:
#   LAN discovery (GET /_dsh/discover) + the HTTP/WebSocket API on `port` + optional cloud relay.
# The phone then pairs with this computer via 「自动发现」 — no file has to be sent to the PC.
#
# Change `port` if 8787 is taken; change/remove `relay` to control remote access.
- insert:
    - id: harmony-bridge
      name: dsh-harmony-bridge
      config:
        port: 8787
        host: 0.0.0.0
        # relay: wss://relay.example.com/bridge   # 用你自己的域名，不要填公网 IP
        # relayPublicUrl: https://relay.example.com:8443
        autoStart: true
        verbose: false
